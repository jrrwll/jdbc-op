subcommandsTitle: 子命令：
paramsTitle: 参数：
optionsTitle: 选项：
identWidth: 2
inheritAlways: true

header: jdbc-op jdbc命令行工具

helpDesc:
  help: 打印此帮助

inheritGroupHeader:
  jdbc: JDBC参数：
  output: 输出参数：
  randomGen: 随机数据生成规则：
  textType: 文本类型探查：

inheritHelpParam:
  rowNullRatio: <ratio,rows>
  rollingFileMaxSqlCount: <maxSqlCount>
  textTypeFile: <file>
  textTypeFileContent: <fileContent>
inheritHelpDesc:
  help: 打印此帮助
  debug: 打印debug信息
  verbose: 详细输出模式
  abort: 遇到异常中断执行
  jdbcUrl: JDBC连接参数：JDBC URL 地址
  user: JDBC连接参数：用户名
  password: JDBC连接参数：密码
  props: 额外的jdbc参数
  driverPaths: JDBC驱动jar包所在目录
  driverClass: JDBC驱动全限定类名
  yes: 是否实际打开JDBC连接并执行SQL
  columnCommentTemplate: "列注释模板\n${ls}例如：Column Type: $type"
  compact: 紧凑模式，SQL不换行
  preColumnDefSql: 自定义的列定义前缀SQL
  postColumnDefSql: 自定义的列定义后缀SQL
  postTableDefSql: 自定义的表定义后缀SQL
  batchSize: 批量插入的大小限制，即生成的values的最大行数
  totalCount: 插入的总行数
  columnQuota: 是否为列名转义
  dataSourceType: 数据源类型，比如 postgresql, mysql, oracle, db2, sqlserver
  converters: 字面量转换函数，例子：binary:cast($value as $type)
  castAs: "在insert into中使用cast(x as y)类型转换函数"
  setEnumValues: set和enum类型的枚举值，默认为a,b,c,d
  rollingFile: 生成的滚动SQL文件，例子：output_${i+100}.sql
  rollingFileMaxSqlCount: 指定每个滚动小文件的最大SQL条数
  nullRatio: 每列生成的值，有多少可能性为null，合法取值范围为[0, 1]
  rowNullRatio: 每rows行中的一行的每列的值，有ratio的可能性为null,例子：0.5,10
  outputFile: 文件名，保存SQL至文件
  outputFileSqlMaxCount: "分文件保存，每个文件的最大SQL数\n${ls}outputFile取a.sql，则生成a1.sql, a2.sql ..."
  textTypeFile: 类型映射文件的路径
  textTypeFileContent: 类型映射文件的文件内容，与-t互斥，，优先取-t的值
  nullType: null值的默认类型
  enableNeg: 是否允许生成负数

subcommands:
  import-json:
    commandDesc: 将json数据导入到数据表中
    header: "jdbc-op import-json 将json数据导入到数据表中"
    helpParam:
      tableName: 数据表名
    helpDesc:
      file: 数据文件的路径
      database: 目标数据库
      jsonNormal: json array格式
      jsonLine: json line格式

  import-csv:
    commandDesc: 将csv数据导入到数据表中
    header: "jdbc-op import-csv 将csv数据导入到数据表中"
    helpParam:
      tableName: 数据表名
    helpDesc:
      file: 数据文件的路径
      database: 目标数据库
      tsv: 使用tsv格式解析而非csv
      emptyStringAsNull: 视空字符串为null

  import-excel:
    commandDesc: 将excel数据导入到多张数据表中
    header: "jdbc-op import-excel 将excel数据导入到多张数据表中"
    helpDesc:
      file: 数据文件的路径
      sheetNames: sheet名的映射规则
      columnNames: "列名的映射规则，支持多值，每个值对应一个sheet\n${ls}例子：--scn '*' 'c_int,c_string,c_date'"
      existing: 是否从现存的数据表中探查类型

  sync:
    commandDesc: 将数据从一个 JDBC 数据源同步至另一个目标数据源
    header: "jdbc-op export-jdbc 将数据从一个 JDBC 数据源同步至另一个目标数据源"
    helpDesc:
      columnQuota: 是否为列名转义
      doubleQuota: 列名转义符是否为双引号
      yes: 是否实际执行同步
      jdbcUrl1: 源数据源
      jdbcUrl2: 目标数据源
      databases: 需要同步的数据库
      tables: 需要同步的数据表
      tablePattern: 需要同步的数据表pattern
      batchSize: 批量插入的大小限制，即生成的values的最大行数

  insert-random:
    commandDesc: 向指定表插入随机数据
    header: "jdbc-op insert-random 向指定表插入随机数据\n例子：jdbc-op insert-random test_table --jdbc-url jdbc:mysql://127.0.0.1:3306/test_db \
           -uroot -proot -d /path/to/mysql-jdbc-driver.jar -n10 -i id ctime mtime"
    helpParam:
      batchSize: <n>
      rowNum: <n>
    helpDesc:
      tableName: 数据表名，例如：my_table, my_db.my_table
      ignoredColumns: 忽略的列，可以传入多个值
      partitionColumns: 指定分区列

  type-table:
    commandDesc: 通过指定的类型生成相应的表和数据
    header: "jdbc-op type-table 通过指定的类型生成相应的表和数据\n例子：jdbc-op typed-table t_all_type -t int double date"
    helpParam:
      types: <type1 type2 ...>
      partitionTypes: <type1 type2 ...>
      columnCommentSql: sql
      batchSize: <n>
      rowNum: <n>
    helpDesc:
      tableName: 数据表名，例如：my_table, my_db.my_table
      file: "描述列类型文件，以换行符\\n分隔\n${ls}例如：`int`, `varchar(%d)`, `@decimal(%d, %d)`；加上@前缀，表示是分区类型"
      fileContent: 描述列类型文件内容，与--file的区别在于，接受的参数是文本内容而非文件名
      types: 列类型，可以传入多个值，与-f互斥，优先取-f的值
      partitionTypes: 分区类型
